<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ Life Is A Mess</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #0b0f1a;
  font-family: Arial, sans-serif;
}

.page {
  max-width: 480px;
  margin: auto;
}

.title {
  color: #ffffff;
  font-size: 18px;
  font-weight: 700;
  padding: 15px 15px 5px;
}

.desc {
  color: #9aa4b2;
  font-size: 13px;
  padding: 0 15px 10px;
}

.video-box {
  position: relative;
}

video {
  width: 100%;
  max-height: 75vh;
  object-fit: contain;
  background: #000;
}

.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #cbd5e1;
}

/* 🔥 OVERLAY IKLAN */
.overlay-ad{
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

.close-btn{
  margin-top:10px;
  padding:8px 14px;
  background:#fff;
  color:#000;
  border:none;
  border-radius:6px;
  cursor:pointer;
  display:none;
}

.rec-title {
  color: #e2e8f0;
  font-size: 16px;
  font-weight: bold;
  padding: 15px;
}

.native-wrap {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.banner-300 {
  display: flex;
  justify-content: center;
  padding: 20px 0;
}
</style>
</head>

<body>

<div class="page">

<div class="title">
This Clip Is Going Viral For A Reason 👀
</div>

<div class="desc">
People are talking about this everywhere. Watch and decide for yourself what really happened.
</div>

<div class="video-box">
<div class="loading" id="loading">Loading video...</div>

<video 
id="player"
controls
muted
playsinline
preload="metadata"
poster="https://via.placeholder.com/480x720?text=Loading"
controlsList="nodownload noremoteplayback"
disablePictureInPicture
>
<source id="videoSource" src="" type="video/mp4">
</video>
</div>

<!-- 🔝 BANNER ATAS -->
<div class="banner-300">
<!-- <script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
 -->
</div>

<div class="rec-title">🔥 Trending Videos</div>

<!-- 🔽 NATIVE BAWAH -->
<div class="native-wrap">
<!-- <script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
 -->
</div>

</div>

<!-- 🔥 OVERLAY IKLAN -->
<div class="overlay-ad" id="overlayAd">
<div id="adContainer"></div>
<button class="close-btn" id="closeBtn" onclick="closeAd()">Close</button>
</div>

<script>
(function () {

const params = new URLSearchParams(window.location.search);
let video = params.get("v");

if (!video) {
  video = "https://cdn.videy.co/AAU8a62J1.mp4";
}

if (!video.startsWith("http")) {
  video = "https://cdn.videy.co/" + video;
}

const player = document.getElementById("player");
const source = document.getElementById("videoSource");
const loading = document.getElementById("loading");

const overlay = document.getElementById("overlayAd");
const adContainer = document.getElementById("adContainer");
const closeBtn = document.getElementById("closeBtn");

source.src = video;
player.load();

player.play().catch(() => {});

player.addEventListener("loadeddata", () => {
  loading.style.display = "none";
});

player.addEventListener("contextmenu", e => e.preventDefault());

// =====================
// 🔥 LOAD IKLAN FIX
// =====================
function loadAd(){
  adContainer.innerHTML = "";

  var s1 = document.createElement("script");
  s1.innerHTML = `
    var atOptions = {
      'key' : '2b7e76e37b7f6c2fc55e3b3cc5249be3',
      'format' : 'iframe',
      'height' : 50,
      'width' : 320,
      'params' : {}
    };
  `;

  var s2 = document.createElement("script");
  s2.src = "https://www.highperformanceformat.com/2b7e76e37b7f6c2fc55e3b3cc5249be3/invoke.js";
  s2.async = true;

  adContainer.appendChild(s1);
  adContainer.appendChild(s2);
}

// =====================
// 🎬 VIDEO SELESAI
// =====================
player.addEventListener("ended", function(){
  overlay.style.display = "flex";
  loadAd();

  setTimeout(()=>{
    closeBtn.style.display = "block";
  }, 5000);
});

// close
window.closeAd = function(){
  overlay.style.display = "none";
}

// optional: trigger dari klik biar iklan pasti load
player.addEventListener("click", function(){
  loadAd();
});

})();
</script>

</body>
</html>
