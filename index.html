<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotScope TV</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
}

.container{
width:100%;
max-width:420px;
position:relative;
}

/* IKLAN */
.ad-box{
width:100%;
margin:12px 0;
text-align:center;
}

/* VIDEO */
video{
width:100%;
border-radius:12px;
background:#000;
}

/* TITLE */
.title{
font-size:16px;
margin:12px 0;
text-align:center;
}

/* OVERLAY IKLAN */
.overlay-ad{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:10;
border-radius:12px;
}

.overlay-ad .content{
text-align:center;
}

/* tombol close */
.close-btn{
margin-top:12px;
padding:8px 14px;
background:#fff;
color:#000;
border:none;
border-radius:6px;
cursor:pointer;
font-size:12px;
display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- 🔝 IKLAN ATAS -->
<div class="ad-box">
<!-- <script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
 -->
</div>

<!-- VIDEO -->
<video id="videoPlayer" controls autoplay muted playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- 🔽 IKLAN BAWAH -->
<div class="ad-box">
<!-- <script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
 -->
</div>

<div class="title">
Watch till the end 😳🔥
</div>

<!-- 🔥 OVERLAY IKLAN -->
<div class="overlay-ad" id="overlayAd">
<div class="content" id="adContent">

<!-- IKLAN AKAN DIMUAT DI SINI -->

<button class="close-btn" id="closeBtn" onclick="closeAd()">Close</button>

</div>
</div>

</div>

<script>
// ===============================
// AMBIL PARAMETER VIDEO
// ===============================
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

const video = document.getElementById("videoPlayer");
const source = document.getElementById("videoSource");
const overlay = document.getElementById("overlayAd");
const adContent = document.getElementById("adContent");
const closeBtn = document.getElementById("closeBtn");

if(videoId){
source.src = "https://cdn.videy.co/" + videoId + ".mp4";
video.load();
}else{
document.querySelector(".title").innerText = "Video tidak ditemukan";
}

// ===============================
// LOAD IKLAN (INJECT SCRIPT)
// ===============================
function loadAd(){
adContent.insertAdjacentHTML("afterbegin", `
<script>
  atOptions = {
    'key' : '2b7e76e37b7f6c2fc55e3b3cc5249be3',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
<\/script>
<script src="https://www.highperformanceformat.com/2b7e76e37b7f6c2fc55e3b3cc5249be3/invoke.js"><\/script>
`);
}

// ===============================
// EVENT: VIDEO SELESAI
// ===============================
video.addEventListener("ended", function(){
overlay.style.display = "flex";
loadAd();

// tombol close muncul setelah 5 detik
setTimeout(()=>{
closeBtn.style.display = "inline-block";
}, 5000);
});

// ===============================
// TOMBOL CLOSE
// ===============================
function closeAd(){
overlay.style.display = "none";
}

// ===============================
// BONUS: UNMUTE SAAT KLIK VIDEO
// ===============================
video.addEventListener("click", () => {
video.muted = false;
video.play();
});
</script>

</body>
</html>
