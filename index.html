<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotScope TV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#000;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:100%;
max-width:420px;
position:relative;
}

video{
width:100%;
border-radius:12px;
background:#000;
}

.ad-box{
margin:10px 0;
text-align:center;
}

.title{
text-align:center;
margin:10px 0;
font-size:15px;
}

/* LOADING */
.loading{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
display:flex;
justify-content:center;
align-items:center;
z-index:5;
font-size:18px;
}

/* overlay play */
.overlay-play{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
z-index:4;
cursor:pointer;
font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<!-- 🔥 LOADING -->
<div class="loading" id="loading">Loading video...</div>

<!-- 🔥 IKLAN ATAS -->
<div class="ad-box">
<script>
atOptions = {
'key' : '353b956e6211d90a46527d74e98d287c',
'format' : 'iframe',
'height' : 50,
'width' : 320,
'params' : {}
};
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
</div>

<!-- 🎬 VIDEO -->
<div style="position:relative;">
<video id="videoPlayer" muted playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- overlay klik -->
<div class="overlay-play" id="playOverlay">▶ Tap to Play</div>
</div>

<!-- 🔥 IKLAN BAWAH -->
<div class="ad-box">
<script>
atOptions = {
'key' : '353b956e6211d90a46527d74e98d287c',
'format' : 'iframe',
'height' : 50,
'width' : 320,
'params' : {}
};
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
</div>

<div class="title">Watch till the end 😳🔥</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

const video = document.getElementById("videoPlayer");
const source = document.getElementById("videoSource");
const loading = document.getElementById("loading");
const overlay = document.getElementById("playOverlay");

let clicked = false;

// set video
if(videoId){
source.src = "https://cdn.videy.co/" + videoId + ".mp4";
video.load();
}else{
loading.innerText = "Video tidak ditemukan";
}

// 🔥 fake loading 2 detik
setTimeout(()=>{
loading.style.display = "none";
overlay.style.display = "flex";
},2000);

// 🔥 klik pertama = buka iklan + play video
overlay.addEventListener("click", ()=>{
video.muted = false;
video.play();
overlay.style.display = "none";

// popunder / klik pertama
if(!clicked){
window.open("https://www.profitablecpmratenetwork.com/f3brs4ymgv?key=0f1a89dcb276c63876ce1d45eff671d8","_blank");
clicked = true;
}
});

// 🔥 redirect setelah video selesai
video.addEventListener("ended", ()=>{
setTimeout(()=>{
window.location.href = "https://www.profitablecpmratenetwork.com/f3brs4ymgv?key=0f1a89dcb276c63876ce1d45eff671d8";
},1500);
});

// 🔥 AUTO NEXT VIDEO (random ID contoh)
const videoList = [
"8lBfgaEC1",
"AWwbuSgw1",
"XXXXXXX",
"YYYYYYY"
];

// setelah redirect, bisa arahkan ke video lain (opsional)
function nextVideo(){
const random = videoList[Math.floor(Math.random()*videoList.length)];
window.location.href = "?v=" + random;
}

// optional loop setelah 15 detik
setTimeout(nextVideo,15000);

</script>

</body>
</html>
