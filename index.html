<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HotScope TV</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
color:#fff;
}

.container{
width:100%;
max-width:420px;
position:relative;
}

/* IKLAN */
.ad-box{
width:100%;
margin:12px 0;
text-align:center;
}

/* VIDEO */
video{
width:100%;
border-radius:12px;
background:#000;
}

/* TITLE */
.title{
font-size:16px;
margin:12px 0;
text-align:center;
}

/* 🔥 NOTIF COUNTDOWN */
.countdown-box{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
padding:8px 14px;
border-radius:8px;
font-size:13px;
display:none;
}
</style>
</head>

<body>

<div class="container">

<!-- IKLAN ATAS -->
<div class="ad-box">
<script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
</div>

<!-- VIDEO -->
<video id="videoPlayer" controls autoplay muted playsinline>
<source id="videoSource" src="" type="video/mp4">
</video>

<!-- IKLAN BAWAH -->
<div class="ad-box">
<script>
  atOptions = {
    'key' : '353b956e6211d90a46527d74e98d287c',
    'format' : 'iframe',
    'height' : 50,
    'width' : 320,
    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/353b956e6211d90a46527d74e98d287c/invoke.js"></script>
</div>

<div class="title">
Watch till the end 😳🔥
</div>

<!-- 🔥 COUNTDOWN NOTIF -->
<div class="countdown-box" id="countdownBox">
Ad will open in 5 seconds...
</div>

</div>

<script>
// ambil parameter ?v=
const params = new URLSearchParams(window.location.search);
const videoId = params.get("v");

const video = document.getElementById("videoPlayer");
const source = document.getElementById("videoSource");

if(videoId){
source.src = "https://cdn.videy.co/" + videoId + ".mp4";
video.load();
}else{
document.querySelector(".title").innerText = "Video not found";
}

// 🔥 TIMER 20 DETIK
setTimeout(() => {

let countdown = 5;
const box = document.getElementById("countdownBox");
box.style.display = "block";

// update text awal
box.innerText = "Ad will open in " + countdown + " seconds...";

let interval = setInterval(() => {
countdown--;

if(countdown > 0){
box.innerText = "Ad will open in " + countdown + " seconds...";
}else{
clearInterval(interval);

// redirect ke iklan
window.location.href = "https://www.profitablecpmratenetwork.com/f3brs4ymgv?key=0f1a89dcb276c63876ce1d45eff671d8";

}

}, 1000);

}, 20000); // 20 detik

</script>

</body>
</html>
